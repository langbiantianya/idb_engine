[versions]
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
hikari = "7.0.2"
slf4j = "2.0.18"
logback = "1.5.13"
mysql-connector = "9.7.0"
postgresql = "42.7.11"
h2 = "2.3.232"
luajava = "4.1.0"
poi = "5.5.1"
parquet = "1.17.1"
hadoop = "3.5.0"
grpc = "1.76.0"
grpc-kotlin = "1.4.1"
protobuf = "4.28.2"
protobuf-plugin = "0.9.4"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
luajava = { module = "party.iroiro.luajava:luajava", version.ref = "luajava" }
luajit = { module = "party.iroiro.luajava:luajit", version.ref = "luajava" }
lua51 = { module = "party.iroiro.luajava:lua51", version.ref = "luajava" }
lua52 = { module = "party.iroiro.luajava:lua52", version.ref = "luajava" }
lua53 = { module = "party.iroiro.luajava:lua53", version.ref = "luajava" }
lua54 = { module = "party.iroiro.luajava:lua54", version.ref = "luajava" }
lua55 = { module = "party.iroiro.luajava:lua55", version.ref = "luajava" }

# Excel/Word导出
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

# Parquet 列式存储
parquet-hadoop = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquet" }
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop" }

# gRPC — 统一服务端 IPC 协议
# grpc-stub: io.grpc.Server / ServerBuilder（transport.serverBuilder() 调用）
# grpc-protobuf: io.grpc.protobuf.ProtoUtils（grpc-kotlin 生成的 stub 内部依赖的 Java 类型）
# grpc-netty-shaded: io.grpc.netty.shaded.io.grpc.netty.NettyServerBuilder + Netty（IPC transport）
# grpc-kotlin-stub: io.grpc.kotlin.*（生成代码 IdbEngineGrpcKt 的协程 stub 与 IdbEngineCoroutineImplBase）
# protobuf-kotlin-lite: com.google.protobuf.kotlin.*（生成代码 *Kt DSL 与 .Dsl 内部类）
#   grpc-core / grpc-api / grpc-context / grpc-util 由 grpc-stub / grpc-protobuf 传递依赖
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }

[bundles]

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
