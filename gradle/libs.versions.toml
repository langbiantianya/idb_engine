[versions]
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
hikari = "7.0.2"
slf4j = "2.0.18"
logback = "1.5.13"
mysql-connector = "9.7.0"
postgresql = "42.7.11"
h2 = "2.3.232"
duckdb = "1.5.5.1"
luajava = "4.1.0"
poi = "5.5.1"
parquet = "1.17.1"
hadoop = "3.5.0"
grpc = "1.83.1"
grpc-kotlin = "1.5.0"
protobuf = "4.35.1"
protobuf-plugin = "0.10.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
luajava = { module = "party.iroiro.luajava:luajava", version.ref = "luajava" }
luajit = { module = "party.iroiro.luajava:luajit", version.ref = "luajava" }
lua51 = { module = "party.iroiro.luajava:lua51", version.ref = "luajava" }
lua52 = { module = "party.iroiro.luajava:lua52", version.ref = "luajava" }
lua53 = { module = "party.iroiro.luajava:lua53", version.ref = "luajava" }
lua54 = { module = "party.iroiro.luajava:lua54", version.ref = "luajava" }
lua55 = { module = "party.iroiro.luajava:lua55", version.ref = "luajava" }

# Excel/Word导出
poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

# Parquet 列式存储
parquet-hadoop = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquet" }
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop" }

grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }

[bundles]

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
